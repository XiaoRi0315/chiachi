<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聯絡我 | Contact</title>
  <!-- 字型與樣式 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-container">
    <header class="section-header">
      <span class="section-tag">Get in Touch</span>
      <h1 class="section-title">聯絡我</h1>
    </header>

    <main class="contact-wrapper">
      <div class="contact-direct">
        直接來信聯絡：<a href="mailto:tina101793@gmail.com">tina101793@gmail.com</a><br />
        或直接填寫下方表單，送出後訊息將自動寄送至我的信箱。
      </div>

      <!-- 寄信表單 (請將 YOUR_FORM_ID 替換成 Formspree ID) -->
      <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
          <label for="email" class="form-label">您的電子郵件 (Email)</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="name@example.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="message" class="form-label">想對我說的話</label>
          <textarea 
            id="message" 
            name="message" 
            rows="5" 
            class="form-textarea" 
            placeholder="請輸入您的訊息內容..." 
            required
          ></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">發送訊息</button>
        <div id="statusMessage" class="status-message"></div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
